  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#plate)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="url(#edge)" stroke-width="3.5"/>
  <text x="15" y="47" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffd43b">p</text>
  <text x="30" y="47" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="url(#sol)">S</text>
