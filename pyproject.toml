[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pythsol"
version = "0.1.0"
description = "PythSol: write Solana programs in a typed Python subset, compiled to native SBF."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "PythSol contributors" }]
dependencies = ["click>=8.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# The compiler/CLI itself stays runtime-dep-free.
# `pythsol[test]` adds what the in-process SVM test harness needs.
test = ["pytest>=8", "pytest-cov>=4", "solders>=0.27,<0.30", "solana>=0.41"]
dev = ["ruff>=0.5", "mypy>=1.10", "pyright>=1.1.350", "hatchling>=1.24", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/PythSol/pythsol"
Repository = "https://github.com/PythSol/pythsol"
Issues = "https://github.com/PythSol/pythsol/issues"
Changelog = "https://github.com/PythSol/pythsol/blob/main/CHANGELOG.md"

[project.scripts]
pythsol = "pythsol.cli.main:main"
# Spec-draft naming: keep `pysol` working because PRD/TRD examples say `pysol build`.
pysol = "pythsol.cli.main:main"

[project.entry-points.pytest11]
pythsol = "pythsol.testing.plugin"

[tool.hatch.build.targets.wheel]
# Src layout: auto-detected by hatchling (src/pythsol).

[tool.hatch.build.targets.wheel.force-include]
"src/pythsol/playground/index.html" = "pythsol/playground/index.html"
"src/pythsol/playground/landing.html" = "pythsol/playground/landing.html"
"src/pythsol/playground/playground.html" = "pythsol/playground/playground.html"
"src/pythsol/playground/docs.html" = "pythsol/playground/docs.html"
"src/pythsol/playground/site.css" = "pythsol/playground/site.css"
"src/pythsol/playground/app.js" = "pythsol/playground/app.js"
"src/pythsol/playground/app.css" = "pythsol/playground/app.css"
"src/pythsol/playground/favicon.svg" = "pythsol/playground/favicon.svg"
"src/pythsol/playground/favicon.ico" = "pythsol/playground/favicon.ico"
"src/pythsol/playground/favicon-32.png" = "pythsol/playground/favicon-32.png"
"src/pythsol/playground/apple-touch-icon.png" = "pythsol/playground/apple-touch-icon.png"
"src/pythsol/playground/hero-bg.webp" = "pythsol/playground/hero-bg.webp"
"src/pythsol/playground/site-bg.svg" = "pythsol/playground/site-bg.svg"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "Spikes", "docs", "*.md", "*.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E203", "RUF012"]  # allow mutable class attrs on decorators like @program.

[tool.ruff.lint.per-file-ignores]
# Fixture sources inside test tables legitimately exceed the line limit.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/pythsol", "examples"]
exclude = "Spikes"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --tb=short"
testpaths = ["tests"]
markers = [
  "toolchain: requires the SBF platform-tools to compile to native .so",
  "smoke: end-to-end spike against LiteSVM + SBF toolchain",
  "unit: fast local unit test",
]
filterwarnings = [
  "error::DeprecationWarning:pythsol.*",  # Python parser must be spam-free.
]

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
source = ["pythsol"]
omit = ["src/pythsol/runtime/*"]
